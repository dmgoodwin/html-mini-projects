<!DOCTYPE html>
<html>
	<head>
		<title>hyperbolic_test</title>
		<style>
			canvas {
				width: 100%;
				height: 100%;
				border: 1px solid #bb7530;
			}
		</style>
	</head>
	<body style="overflow:hidden;">
		<canvas id="canvas" width="1904" height="902"></canvas>
		<script>
			window.oncontextmenu = (e) => {
				e.preventDefault();
			}
		</script>
		<script src="tiling.js"></script>
		<script src="hyperbolic_geom.js"></script>
		<script src="hyperbolic_tiling.js"></script>
		<script type="text/javascript">

var canvas = document.getElementById("canvas");
var ctx = canvas.getContext("2d");
var mouseX = 0, mouseY = 0;
var mouseDown = false, mouseRightDown = false;
var wDown = false, aDown = false, sDown = false, dDown = false;
var printDebug = false;

canvas.onmousemove = function(event){
	mouseX = event.clientX;
	mouseY = event.clientY;
};
canvas.onmousedown = function(event){
	switch(event.button){
		case 0:
			mouseDown = true;
			break;
		case 2:
			mouseRightDown = true;
			break;
	}
}
canvas.onmouseout = function(event){
	mouseDown = false;
	mouseRightDown = false;
}
canvas.onmouseup = function(event){
	switch(event.button){
		case 0:
			mouseDown = false;
			break;
		case 2:
			mouseRightDown = false;
			break;
	}
}
document.onkeydown = function(events){
    let x = events.which || events.keyCode;
    if(String.fromCharCode(x) == "W"[0]){
		
        wDown = true;
    }
	if(String.fromCharCode(x) == "A"[0]){
		
        aDown = true;
    }
	if(String.fromCharCode(x) == "S"[0]){
		
        sDown = true;
    }
	if(String.fromCharCode(x) == "D"[0]){
		
        dDown = true;
    }
}
document.onkeyup = function(events){
    let x = events.which || events.keyCode;
    if(String.fromCharCode(x) == "W"[0]){
		
        wDown = false;
    }
	if(String.fromCharCode(x) == "A"[0]){
		
        aDown = false;
    }
	if(String.fromCharCode(x) == "S"[0]){
		
        sDown = false;
    }
	if(String.fromCharCode(x) == "D"[0]){
		
        dDown = false;
    }
	if(String.fromCharCode(x) == "F"[0]){
		
        printDebug = true;
    }
}

function drawBackgroundCircle(ctx, width=-1, height=-1){
	if (width == -1){
		width = canvas.width;
	}
	if(height == -1){
		height = canvas.height;
	}
	let radius = Math.min(width, height) * 0.5;
	ctx.beginPath();
	ctx.arc(width*0.5,height*0.5, radius, 0, 2*Math.PI, false);
	ctx.fillStyle = "#111111";
	ctx.fill();
}

//////////////////////////////////////////////////////////////////////////

function Data(){
	this.points = [
		// new HomoVec(0, 0, 1).normalize_(),
		// new HomoVec(Math.sinh(1), 0, Math.cosh(1)).normalize_(),
		// new HomoVec(Math.sinh(-1), 0, Math.cosh(1)).normalize_(),
		// new HomoVec(0, Math.sinh(1), Math.cosh(1)).normalize_(),
		// new HomoVec(0, Math.sinh(-1), Math.cosh(1)).normalize_(),
	];

	this.camera = new HomoRot();
	this.movespeed = 0.01;
	this.pentagons = new HyperbolicPentagonTiling(3);

	this.rotAmt = 0;

	this.between = 0;
	this.toggle = 0;
	this.toggleSpeed = 0.25;
}
var data = new Data();

function inputEvents(data){

	let moveX = (dDown? data.movespeed: 0) - (aDown? data.movespeed: 0);
	let moveY = (wDown? data.movespeed: 0) - (sDown? data.movespeed: 0);
	

	let moveAmt = new HomoVec(moveX, moveY, 1.0);
	let cameraMovement = new HomoRot().globalToLocal_(moveAmt);
	//console.log(moveAmt);

	data.camera = cameraMovement.dotRot(data.camera);
	
	if(data.rotAmt != 0){
		
		rotate = new HomoRot().rotation_(data.rotAmt);
		data.camera = data.camera.dotRot(rotate);
	}

	if(printDebug) {
		console.log(data.camera);
		console.log(data.camera.normalize());
		data.camera = data.camera.normalize();
		printDebug = false;

		data.toggle = 1 - data.toggle;
	}

	data.between = (1-data.toggleSpeed)*data.between + data.toggleSpeed*data.toggle;
	
	//data.camera.precisify_();
}

function drawDots(ctx, data, dotRadius=8, width=-1, height=-1){

	if (width == -1){
		width = canvas.width;
	}
	if(height == -1){
		height = canvas.height;
	}
	let radius = Math.min(width, height) * 0.5;

	for(let i = 0; i < data.points.length; i++) {

		let coordinate = data.camera.dotVec(data.points[i]);

		ctx.beginPath();
		ctx.arc(
			width*0.5 + coordinate.beltramiKleinX()*radius,
			height*0.5 + -coordinate.beltramiKleinY()*radius,
			dotRadius, 0, 2*Math.PI, false
		);
		ctx.fillStyle = "#000000";
		ctx.fill();
	}
}

function drawPentagon(ctx, data, width=canvas.width,height=canvas.height) {

	let radius = Math.min(width, height) * 0.5;
	// let corners = data.pentagons.corners.slice();
	for(let j = 0; j < data.pentagons.nodeGraph.length; j++){
		
		let corners = data.pentagons.corners.slice();
		let node = data.pentagons.nodeGraph[j];

		// let matrix = data.camera.dotRot(node.matrix.inverse());
		for(let i = 0; i < 5; i++){
			corners[i] = node.matrix.inverse().dotVec(corners[i]);
		}
		for(let i = 0; i < 5; i++){
			corners[i] = data.camera.dotVec(corners[i]);
			corners[i].normalize_();
		}

		ctx.beginPath();
		ctx.moveTo(
			// width*0.5 + corners[corners.length-1].beltramiKleinX()*radius,
			// height*0.5 - corners[corners.length-1].beltramiKleinY()*radius,
			width*0.5 + corners[corners.length-1].betweenBPX(data.between)*radius,
			height*0.5 - corners[corners.length-1].betweenBPY(data.between)*radius,
		);
		ctx.lineWidth = 0;
		for(let i = 0; i < 5; i++) {
			ctx.lineTo(
				// width*0.5 + corners[i].beltramiKleinX()*radius,
				// height*0.5 - corners[i].beltramiKleinY()*radius,
				width*0.5 + corners[i].betweenBPX(data.between)*radius,
				height*0.5 - corners[i].betweenBPY(data.between)*radius,
			);
		}
		
		ctx.fillStyle = node.color;
		ctx.fill();
	}
}


function processOneFrame(){
	
	ctx.clearRect(0,0,canvas.width,canvas.height);

	inputEvents(data);



	// drawBackgroundCircle(ctx);
	drawPentagon(ctx, data);
	drawDots(ctx, data);
	requestAnimationFrame(processOneFrame);
}

processOneFrame()

		</script>
	</body>
</html>
